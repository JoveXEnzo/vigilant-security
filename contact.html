<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Vigilant Proprietary Security</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="navbar"></div>

    <section id="contact-hero" class="parallax">
        <h1>Get in Touch</h1>
    </section>

    <section id="contact-info">
        <p><i class="fas fa-phone"></i> (123) 456-7890</p>
        <p><i class="fas fa-envelope"></i> info@vigilantsecurity.com</p>
        <p><i class="fas fa-map-marker-alt"></i> Upland & Anaheim, CA</p>
    </section>

    <section id="contact-form-section">
        <form id="contact-form" onsubmit="submitForm(event)">
            <input type="text" placeholder="Name" required aria-label="Name">
            <input type="email" placeholder="Email" required aria-label="Email">
            <textarea placeholder="Message" required aria-label="Message"></textarea>
            <button type="submit" class="btn">Submit Inquiry</button>
        </form>
        <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3310.0... [Upland/Anaheim embed]" width="600" height="450" loading="lazy"></iframe>
    </section>

    <div id="footer"></div>
    <script src="script.js"></script>
</body>
</html>
